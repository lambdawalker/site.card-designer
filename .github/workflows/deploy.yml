name: Deploy card designer
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment
        required: true
        type: choice
        options: [dev, qa, prod]
      action:
        description: Operation
        type: choice
        options: [preview, deploy]
        default: preview
permissions:
  contents: read
  id-token: write
concurrency:
  group: card-designer-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.BENCH_REGION }}
      AWS_ROLE_ARN: ${{ vars.BENCH_ROLE_ARN }}
      DEPLOY_PROJECT: ${{ vars.BENCH_PROJECT }}
      DEPLOY_STATE: ${{ vars.BENCH_BACKEND }}
      AWS_ACCOUNT: ${{ vars.BENCH_ACCOUNT }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: deploy/go.mod
          cache-dependency-path: |
            backend/go.sum
            deploy/go.sum
            infra/go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate configuration
        shell: bash
        run: |
          for key in AWS_REGION AWS_ROLE_ARN AWS_ACCOUNT DEPLOY_PROJECT DEPLOY_STATE PULUMI_CONFIG_PASSPHRASE; do
            test -n "${!key}" || { echo "Missing $key"; exit 1; }
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BENCH_ROLE_ARN }}
          aws-region: ${{ vars.BENCH_REGION }}
      - uses: pulumi/actions@v6
      - name: Preview or deploy
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
          DOMAIN: ${{ vars.BENCH_DOMAIN }}
          CERTIFICATE: ${{ vars.BENCH_CERTIFICATE_ARN }}
          ZONE: ${{ vars.BENCH_ZONE_ID }}
          DNS_PROVIDER: ${{ vars.BENCH_DNS_PROVIDER || 'route53' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for key in DOMAIN CERTIFICATE ZONE; do
            test -n "${!key}" || { echo "Missing $key; use explicit none when inapplicable"; exit 1; }
          done
          approval=()
          case "$DNS_PROVIDER" in
            route53|cloudflare) ;;
            *) echo "DNS_PROVIDER must be route53 or cloudflare"; exit 1 ;;
          esac
          if [[ "$DNS_PROVIDER" == cloudflare && "$DOMAIN" != none && "$ZONE" != none ]]; then
            test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          fi
          if [[ "$ACTION" == deploy ]]; then approval+=(--approve); fi
          ./deploy.sh --action "$ACTION" --non-interactive "${approval[@]}" --project "$DEPLOY_PROJECT" --environment "$ENVIRONMENT" --account "$AWS_ACCOUNT" --region "$AWS_REGION" --backend "$DEPLOY_STATE" --domain "$DOMAIN" --certificatearn "$CERTIFICATE" --zoneid "$ZONE" --dnsprovider "$DNS_PROVIDER"
